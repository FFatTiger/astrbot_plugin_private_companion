  function configResponse(query){const sections={}; for(const name of String(query?.sections || "").split(",").filter(Boolean)) sections[name]={settings:JSON.parse(JSON.stringify(configs[name]||{})),edit_token:token,revision:1}; return {sections};}
  function get(route, query){
    route=unwrap(route);

    if(route==="host-options/poke") return routes.poke;

    if(route.includes("/config")) return configResponse(query);
    if(route.endsWith("/image")) return {actions:[{id:"generate",state:"ready",registered:true},{id:"edit",state:"ready",registered:true},{id:"mask_edit",state:"pending",registered:false}],settings:{generate:true,edit:true,mask_edit:false},edit_token:token};

    if(route.endsWith("/image-materials") || route.endsWith("/image-materials/")) return materials;
    if(route.includes("/image-materials/album")) return {items:[{url:materials.references[0].thumbnail_url}]};
    if(route.includes("/reality-access")) return reality;
    if(route.includes("/screen-access")) return {state:"ready",authorized:true,last_observation:"今天 09:40"};
    if(route.includes("/game-access")) return {state:"ready",authorized:true};

  async function post(route, body){
    route=unwrap(route);
    if(route==="semantic" && body?.action==="search") return {items:semantic.items.filter(item=>!body.query || item.name.includes(body.query))};
    if(route==="semantic" && body?.action==="import"){semantic.items.push({id:`meme-${Date.now()}`,name:body.metadata?.name||"新素材",kind:"reaction"});return {created:true};}
    if(route==="semantic" && body?.action==="delete"){semantic.items=semantic.items.filter(item=>item.id!==body.item_id);return {saved:true};}
    if(route.startsWith("host-options/")) return {settings:body.changes||{},edit_token:token};
